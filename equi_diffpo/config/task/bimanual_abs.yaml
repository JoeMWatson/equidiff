name: bimanual_abs

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    agentview_image:
      shape: [3, 72, 128]
      type: rgb
    robot0_left_eye_in_hand_image:
      shape: [3, 72, 128]
      type: rgb
    robot0_right_eye_in_hand_image:
      shape: [3, 72, 128]
      type: rgb
    robot0_left_eef_pos:
      shape: [3]
    robot0_left_eef_quat:
      shape: [4]
    robot0_right_eef_pos:
      shape: [3]
    robot0_right_eef_quat:
      shape: [4]
    robot0_gripper_qpos:
      shape: [2]
  action:
    # 14 raw dims (left: pos3+rot_aa3+gripper1, right: pos3+rot_aa3+gripper1)
    # converted to 20 dims with 6D rotation (left: pos3+rot6d6+gripper1, right: pos3+rot6d6+gripper1)
    shape: [20]

abs_action: &abs_action True

env_runner:
  _target_: equi_diffpo.env_runner.bimanual_image_runner.BimanualImageRunner
  dataset_path: ${dataset_path}
  shape_meta: *shape_meta
  n_train: 6
  n_train_vis: 2
  train_start_idx: 0
  n_test: 10
  n_test_vis: 4
  test_start_seed: 100000
  max_steps: ${get_max_steps:${task_name}}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  render_obs_key: 'agentview_image'
  fps: 10
  crf: 22
  past_action: ${past_action_visible}
  abs_action: *abs_action
  tqdm_interval_sec: 1.0
  n_envs: 4

dataset:
  _target_: ${dataset}
  n_demo: ${n_demo}
  shape_meta: *shape_meta
  dataset_path: ${dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  abs_action: *abs_action
  rotation_rep: 'rotation_6d'
  use_legacy_normalizer: False
  use_cache: True
  seed: 42
  val_ratio: 0.02
